services:
  - type: web
    name: tecateca
    runtime: node
    plan: starter          # a free plan has no disk, so your orders would vanish on every restart
    startCommand: node server.js
    healthCheckPath: /healthz
    disk: { name: data, mountPath: /var/data, sizeGB: 1 }
    envVars:
      - { key: NODE_VERSION, value: "22" }
      - { key: NODE_ENV, value: production }
      - { key: TRUST_PROXY, value: "1" }
      - { key: DB_PATH, value: /var/data/tecateca.db }
      - { key: MPESA_MOCK, value: "1" }        # change to 0 when Safaricom approves you
      - { key: SESSION_SECRET, generateValue: true }
      - { key: MPESA_CALLBACK_SECRET, generateValue: true }
      - { key: BASE_URL, sync: false }          # https://tecateca.onrender.com (or your own domain)
      - { key: ADMIN_EMAIL, sync: false }
      - { key: ADMIN_PASSWORD, sync: false }
